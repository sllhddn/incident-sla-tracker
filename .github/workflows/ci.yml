name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Build and test (.NET 10, SQL Server 2022 in Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - name: Test (unit + integration against a real SQL Server container)
        run: dotnet test --no-build -c Release --logger "trx;LogFileName=results.trx" --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults

  docker:
    name: Docker image builds and boots against SQL Server
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - name: Wait for the API and smoke-test it
        run: |
          for i in $(seq 1 60); do curl -sf localhost:8080/health && break; sleep 2; done
          curl -sf -X POST localhost:8080/api/incidents -H 'Content-Type: application/json' \
            -d '{"title":"Smoke test","service":"CI","severity":"P3","openedBy":"ci"}' | tee /dev/stderr | grep -q '"ref":"INC-'
          curl -sf localhost:8080/api/reports/sla | tee /dev/stderr
      - if: failure()
        run: docker compose logs
